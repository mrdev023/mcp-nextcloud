name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://github.com/actions/checkout@v4

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: https://github.com/actions/checkout@v4

      - uses: https://github.com/docker/setup-buildx-action@v3

      - name: Set registry hostname
        id: registry
        run: |
          host=$(echo '${{ forgejo.server_url }}' | sed 's|https\?://||' | tr '[:upper:]' '[:lower:]')
          image=$(echo '${{ forgejo.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "host=$host" >> "$FORGEJO_OUTPUT"
          echo "image=$image" >> "$FORGEJO_OUTPUT"

      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ forgejo.server_url }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
